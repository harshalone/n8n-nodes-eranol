name: Publish to npm

# Publishes the package to npm with build provenance.
# Provenance cryptographically links the published artifact to this workflow
# run and commit, which n8n requires for verified community nodes.
#
# Trigger by publishing a GitHub Release whose tag matches the version in
# package.json (e.g. tag `v0.3.2` for version `0.3.2`). A manual run via
# workflow_dispatch is also supported for re-publishing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: lets the job mint an OIDC token that npm
  # uses to attest the build source.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
